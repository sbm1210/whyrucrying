<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101418">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>왜 우니</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8f5;
        --panel: #ffffff;
        --panel-2: #eef5f1;
        --text: #27343a;
        --muted: #68787a;
        --line: rgba(58, 78, 84, 0.14);
        --accent: #e88873;
        --accent-2: #79b8a7;
        --danger: #c96d62;
        --page-top: #fbfbf7;
        --page-bottom: #edf5f1;
        --soft: rgba(255, 255, 255, 0.78);
        --surface: rgba(255, 255, 255, 0.74);
        font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #202a2f;
        --panel: #2a353b;
        --panel-2: #243037;
        --text: #f6f3ea;
        --muted: #b9c3c5;
        --line: rgba(255, 255, 255, 0.14);
        --accent: #e69a82;
        --accent-2: #8cc7b7;
        --danger: #e19a8f;
        --page-top: #263238;
        --page-bottom: #1d282d;
        --soft: rgba(255, 255, 255, 0.09);
        --surface: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        background:
          radial-gradient(circle at 15% 0%, rgba(232, 136, 115, 0.22), transparent 24rem),
          radial-gradient(circle at 90% 12%, rgba(121, 184, 167, 0.2), transparent 22rem),
          linear-gradient(180deg, var(--page-top) 0%, var(--bg) 48%, var(--page-bottom) 100%);
        color: var(--text);
        transition: background 180ms ease, color 180ms ease;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .shell {
        width: min(100%, 520px);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      }

      .app-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0 18px;
      }

      .head-actions {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        gap: 8px;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(30px, 10vw, 48px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .started {
        display: inline-block;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .reset-btn,
      .theme-toggle,
      .secondary,
      .primary,
      .dialog-actions button {
        min-height: 42px;
        border-radius: 8px;
        padding: 0 14px;
        font-weight: 800;
      }

      .reset-btn,
      .theme-toggle,
      .secondary,
      .dialog-actions button {
        background: var(--soft);
        color: var(--text);
        border: 1px solid var(--line);
      }

      .theme-toggle {
        white-space: nowrap;
      }

      .home-shell {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .start-panel {
        display: grid;
        align-content: center;
        min-height: min(58svh, 520px);
      }

      .start-actions {
        display: block;
      }

      .start-btn {
        width: 100%;
        min-height: 86px;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font-size: clamp(30px, 10vw, 50px);
        font-weight: 900;
        letter-spacing: 0;
        box-shadow: 0 14px 32px rgba(94, 67, 58, 0.16);
      }

      .warn,
      .care-note {
        border: 1px solid rgba(201, 109, 98, 0.22);
        border-radius: 8px;
        background: rgba(255, 246, 242, 0.84);
        padding: 12px;
        color: #81514b;
        font-size: 13px;
        line-height: 1.5;
      }

      .complete-spacer {
        height: 96px;
      }

      .complete-bar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(100%, 520px);
        padding: 11px 16px max(14px, env(safe-area-inset-bottom));
        background: var(--surface);
        backdrop-filter: blur(16px);
        border-top: 1px solid var(--line);
        z-index: 30;
      }

      .complete-bar .primary {
        width: 100%;
        min-height: 58px;
        border-radius: 14px;
        font-size: 22px;
        font-weight: 900;
        box-shadow: 0 10px 24px rgba(94, 67, 58, 0.18);
      }

      .history-dialog-body {
        margin-top: 12px;
      }

      .progress-meta span {
        color: var(--muted);
        font-size: 13px;
      }

      .bar {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(58, 78, 84, 0.1);
      }

      .bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 180ms ease;
      }

      .attempt-list {
        display: grid;
        gap: 10px;
      }

      .attempt-group {
        display: grid;
        gap: 9px;
      }

      .attempt-group-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 4px 2px;
        border-bottom: 1px solid var(--line);
      }

      .attempt-group-head h2 {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.01em;
        color: var(--text);
      }

      .attempt-group-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 21px;
        height: 21px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        flex: none;
      }

      .attempt-group-head span {
        font-size: 12px;
        font-weight: 800;
        color: var(--accent-2);
      }

      .attempt-group-list {
        display: grid;
        gap: 9px;
      }

      .attempt {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: stretch;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        overflow: hidden;
        transition: border-color 160ms ease, background 160ms ease;
      }

      .attempt.is-checked {
        border-color: rgba(109, 181, 163, 0.65);
        background: linear-gradient(180deg, rgba(121, 184, 167, 0.2), var(--panel));
      }

      .attempt-main {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 12px;
        align-items: center;
        min-height: 58px;
        padding: 11px 8px 11px 13px;
        background: transparent;
        color: var(--text);
        text-align: left;
        transition: transform 160ms ease;
      }

      .attempt-main:active {
        transform: scale(0.99);
      }

      .attempt-check {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 2px solid rgba(58, 78, 84, 0.3);
        border-radius: 8px;
        color: #ffffff;
        background: transparent;
        font-weight: 900;
      }

      :root[data-theme="dark"] .attempt-check {
        border-color: rgba(255, 255, 255, 0.32);
      }

      .attempt.is-checked .attempt-check {
        border-color: var(--accent-2);
        background: var(--accent-2);
      }

      .attempt-copy {
        display: grid;
        gap: 5px;
      }

      .attempt-copy strong {
        font-size: 16px;
        line-height: 1.25;
      }

      .attempt-copy small {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .attempt-hint {
        align-self: stretch;
        width: 46px;
        display: grid;
        place-items: center;
        border-left: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font-size: 17px;
        font-weight: 800;
        line-height: 1;
        transition: color 160ms ease, background 160ms ease;
      }

      .attempt-hint:active {
        background: var(--soft);
      }

      .attempt.is-expanded .attempt-hint {
        color: var(--accent);
      }

      .memo-panel,
      .history {
        margin-top: 14px;
      }

      .memo-panel label,
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      textarea {
        width: 100%;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        padding: 12px;
        line-height: 1.5;
        outline: none;
      }

      textarea:focus {
        border-color: rgba(240, 191, 84, 0.62);
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        padding: 12px;
        outline: none;
      }

      input:focus {
        border-color: rgba(232, 136, 115, 0.62);
      }

      .primary-actions {
        display: grid;
        grid-template-columns: 0.75fr 1.25fr;
        gap: 10px;
        margin: 14px 0 0;
      }

      .primary {
        background: var(--accent);
        color: #ffffff;
      }

      .care-note {
        margin: 0 0 14px;
      }

      .care-note strong {
        display: block;
        margin-bottom: 4px;
      }

      .history {
        padding-bottom: 20px;
      }

      .section-head h2 {
        color: var(--text);
        font-size: 18px;
      }

      .history-item {
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .history-item + .history-item {
        margin-top: 10px;
      }

      .history-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .history-top div {
        display: grid;
        gap: 3px;
      }

      .history-top span,
      .empty {
        color: var(--muted);
        font-size: 13px;
      }

      .icon-btn {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--soft);
        color: var(--text);
        font-size: 22px;
        line-height: 1;
      }

      .history-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      .history-tags span,
      .history-tags em {
        border-radius: 999px;
        background: rgba(109, 181, 163, 0.16);
        color: #356c61;
        padding: 5px 8px;
        font-size: 12px;
        font-style: normal;
      }

      .history-memo {
        margin-top: 10px;
        color: #48585d;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .backup-dialog {
        width: min(calc(100% - 28px), 480px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--text);
        padding: 0;
      }

      .backup-dialog::backdrop {
        background: rgba(39, 52, 58, 0.28);
      }

      .backup-dialog form {
        padding: 16px;
      }

      .settings-dialog {
        width: min(calc(100% - 28px), 520px);
        max-height: min(82svh, 760px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 0;
      }

      .settings-dialog::backdrop {
        background: rgba(39, 52, 58, 0.28);
      }

      .settings-dialog form {
        padding: 16px;
      }

      .settings-section {
        margin-top: 12px;
      }

      .settings-section summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 44px;
        padding: 0 2px;
        color: var(--text);
        cursor: pointer;
        font-weight: 900;
        list-style: none;
      }

      .settings-section summary::-webkit-details-marker {
        display: none;
      }

      .settings-section summary::after {
        content: "접기";
        min-width: 54px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
        color: var(--muted);
        background: var(--soft);
        font-size: 12px;
        font-weight: 900;
        text-align: center;
      }

      .settings-section:not([open]) summary::after {
        content: "펼침";
      }

      .settings-section summary small {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .settings-list {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }

      .settings-empty {
        margin: 0;
        padding: 14px 2px;
        color: var(--muted);
        font-size: 13px;
      }

      .setting-row {
        --drag-shift-x: 0px;
        --drag-shift-y: 0px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        cursor: grab;
        transform: translate(var(--drag-shift-x), var(--drag-shift-y));
        transition:
          transform 170ms cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 170ms ease,
          border-color 170ms ease,
          background 170ms ease,
          opacity 170ms ease;
        will-change: transform;
      }

      .setting-row.dragging {
        border-color: rgba(221, 137, 112, 0.48);
        background: var(--panel);
        box-shadow: 0 12px 24px rgba(53, 63, 59, 0.18);
        opacity: 0.92;
        pointer-events: none;
        transform: translate(var(--drag-shift-x), var(--drag-shift-y)) scale(1.015);
      }

      .setting-row.is-shifting {
        pointer-events: none;
      }

      .drag-handle {
        display: grid;
        place-items: center;
        width: 24px;
        height: 34px;
        border-radius: 8px;
        color: var(--muted);
        background: var(--soft);
        font-weight: 900;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .setting-row div {
        display: grid;
        gap: 4px;
      }

      .setting-row strong {
        font-size: 14px;
      }

      .setting-row small {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .switch {
        display: grid;
        justify-items: center;
        gap: 5px;
        min-width: 46px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .switch input {
        width: 22px;
        height: 22px;
        accent-color: var(--accent-2);
      }

      .add-item-box {
        display: grid;
        gap: 9px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .add-item-btn {
        width: 100%;
      }

      .dialog-head,
      .dialog-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .backup-dialog p {
        margin: 10px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .complete-copy {
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .complete-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
      }

      .complete-actions button {
        min-height: 48px;
      }

      .dialog-actions {
        margin-top: 10px;
        justify-content: flex-end;
      }

      @media (min-width: 760px) {
        .shell {
          padding-top: 34px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
(function (global) {
  const STORAGE_KEY = "whyrucrying.v1";

  const UI_COPY = {
    eyebrow: "Why R U crying?",
    reset: "또 운다",
    title: "왜 우니",
    complete: "그쳤다!!!!",
    memoPlaceholder: "예: 기저귀 확인 후에도 계속 울었고, 안아서 조용한 곳에 가니 조금 진정됨",
  };

  const ATTEMPTS = [
    {
      id: "diaper",
      label: "기저귀가 불편하니?",
      hint: "젖었거나 대변을 봤는지, 엉덩이가 불편해 보이는지 확인해요.",
    },
    {
      id: "hot",
      label: "덥니?",
      hint: "목덜미와 등을 만져 보고, 옷이나 이불이 너무 두껍지 않은지 확인해요.",
    },
    {
      id: "cold",
      label: "춥니?",
      hint: "손발이 차가운지, 실내 온도와 옷차림이 괜찮은지 확인해요.",
    },
    {
      id: "clothes",
      label: "옷이 불편하니?",
      hint: "허리밴드, 양말, 옷 태그, 단추, 지퍼가 조이거나 찌르지 않는지 확인해요.",
    },
    {
      id: "position",
      label: "자세가 불편하니?",
      hint: "눕거나 안긴 자세를 바꿔 보고, 목이나 몸이 불편하게 꺾이지 않았는지 살펴봐요.",
    },
    {
      id: "hungry",
      label: "배고프니?",
      hint: "마지막 수유나 식사 시간과 양을 떠올려 보고, 먹고 싶어 하는 신호가 있는지 확인해요.",
    },
    {
      id: "burp",
      label: "트림하고 싶니?",
      hint: "최근에 먹었다면 세워 안고 등을 부드럽게 토닥여 봐요.",
    },
    {
      id: "gas",
      label: "배에 가스가 찼니?",
      hint: "배가 빵빵한지 보고, 다리를 천천히 움직이거나 배를 부드럽게 마사지해요.",
    },
    {
      id: "hold",
      label: "안기고 싶니?",
      hint: "가까이 안아 주고 작게 말을 걸었을 때 진정되는지 확인해요.",
    },
    {
      id: "noise",
      label: "시끄러워서 힘드니?",
      hint: "TV, 대화 소리, 생활 소음이 큰지 보고 조용한 곳으로 옮겨 봐요.",
    },
    {
      id: "light",
      label: "빛이 너무 밝니?",
      hint: "조명을 낮추거나 커튼을 쳐서 눈부시지 않은 환경을 만들어 봐요.",
    },
    {
      id: "sleepy",
      label: "졸리니?",
      hint: "마지막 낮잠이나 밤잠 시간을 떠올려 보고, 졸린 신호가 있었는지 확인해요.",
    },
    {
      id: "overtired",
      label: "너무 피곤하니?",
      hint: "오래 깨어 있었거나 자극이 많았다면, 조용하고 어두운 환경에서 쉬게 해요.",
    },
    {
      id: "unfamiliar",
      label: "낯설어서 불안하니?",
      hint: "낯선 장소, 낯선 사람, 갑작스러운 변화가 있었는지 떠올려 봐요.",
    },
    {
      id: "startled",
      label: "놀랐니?",
      hint: "큰 소리, 갑작스러운 움직임, 낯선 상황 이후 울기 시작했는지 확인해요.",
    },
    {
      id: "want",
      label: "원하는 게 있니?",
      hint: "장난감, 음식, 이동, 놀이 중단처럼 아이가 원하던 것이 있었는지 살펴봐요.",
    },
    {
      id: "gums",
      label: "잇몸이 불편하니?",
      hint: "침을 많이 흘리거나 손을 입에 넣는지, 잇몸이 예민해 보이는지 확인해요.",
    },
    {
      id: "skin",
      label: "피부가 불편하니?",
      hint: "발진, 땀띠, 벌레 물림, 옷에 쓸린 자국이 있는지 살펴봐요.",
    },
    {
      id: "pain",
      label: "어딘가 아프니?",
      hint: "특정 부위를 만지면 더 우는지, 평소와 다른 자세나 움직임이 있는지 확인해요.",
    },
    {
      id: "stuck",
      label: "어디 끼거나 감긴 게 있니?",
      hint: "머리카락이 손가락이나 발가락에 감겼는지, 작은 상처나 끼임이 없는지 살펴봐요.",
    },
  ];

  const ATTEMPT_GROUPS = [
    { id: "body", title: "몸이 불편한가" },
    { id: "env", title: "환경이 거슬리나" },
    { id: "feel", title: "마음이 불편한가" },
    { id: "pain", title: "아프거나 이상한가" },
    { id: "custom", title: "직접 추가한 항목" },
  ];

  const ATTEMPT_GROUP = {
    diaper: "body", hungry: "body", burp: "body", gas: "body", sleepy: "body", overtired: "body",
    hot: "env", cold: "env", clothes: "env", position: "env", noise: "env", light: "env",
    hold: "feel", unfamiliar: "feel", startled: "feel", want: "feel",
    gums: "pain", skin: "pain", pain: "pain", stuck: "pain",
  };

  function normalizeChecklistItems(items) {
    if (!Array.isArray(items)) {
      return ATTEMPTS.map((item) => ({ ...item, hidden: false, custom: false }));
    }

    const defaults = new Map(ATTEMPTS.map((item) => [item.id, item]));
    const seen = new Set();
    const ordered = [];

    items.forEach((item) => {
      if (!item || !item.id || seen.has(item.id)) return;
      const base = defaults.get(item.id);
      if (base) {
        ordered.push({ ...base, hidden: !!item.hidden, custom: false });
        seen.add(item.id);
        return;
      }
      if (item.custom && item.label && item.hint) {
        ordered.push({
          id: item.id,
          label: item.label,
          hint: item.hint,
          hidden: !!item.hidden,
          custom: true,
        });
        seen.add(item.id);
      }
    });

    ATTEMPTS.forEach((item) => {
      if (!seen.has(item.id)) ordered.push({ ...item, hidden: false, custom: false });
    });

    return ordered;
  }

  function createSession(now = Date.now(), items = ATTEMPTS) {
    return {
      id: String(now),
      startedAt: now,
      attempts: normalizeChecklistItems(items).map((item) => ({
        id: item.id,
        label: item.label,
        hint: item.hint,
        checked: false,
      })),
      memo: "",
    };
  }

  function normalizeSession(session, items = ATTEMPTS) {
    const normalizedItems = normalizeChecklistItems(items);
    const previous = new Map(
      Array.isArray(session && session.attempts)
        ? session.attempts.map((item) => [item.id, item])
        : []
    );
    return {
      id: session && session.id ? session.id : String(Date.now()),
      startedAt: session && session.startedAt ? session.startedAt : Date.now(),
      attempts: normalizedItems.map((item) => ({
        id: item.id,
        label: item.label,
        hint: item.hint,
        checked: !!(previous.get(item.id) && previous.get(item.id).checked),
      })),
      memo: session && session.memo ? session.memo : "",
    };
  }

  function getVisibleAttempts(session, items = ATTEMPTS) {
    const itemMap = new Map(normalizeChecklistItems(items).map((item) => [item.id, item]));
    return session.attempts.filter((attempt) => {
      const item = itemMap.get(attempt.id);
      return item && !item.hidden;
    });
  }

  function setChecklistItemHidden(items, id, hidden) {
    return normalizeChecklistItems(items).map((item) =>
      item.id === id ? { ...item, hidden: !!hidden } : item
    );
  }

  function addChecklistItem(items, item) {
    const label = (item && item.label ? item.label : "").trim();
    const hint = (item && item.hint ? item.hint : "").trim();
    if (!label || !hint) return normalizeChecklistItems(items);
    return [
      ...normalizeChecklistItems(items),
      {
        id: `custom-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        label,
        hint,
        hidden: false,
        custom: true,
      },
    ];
  }

  function reorderChecklistItem(items, draggedId, targetId, placement = "after") {
    const next = normalizeChecklistItems(items);
    const from = next.findIndex((item) => item.id === draggedId);
    const to = next.findIndex((item) => item.id === targetId);
    if (from < 0 || to < 0 || from === to) return next;
    const [dragged] = next.splice(from, 1);
    const targetIndex = next.findIndex((item) => item.id === targetId);
    next.splice(placement === "before" ? targetIndex : targetIndex + 1, 0, dragged);
    return next;
  }

  function toggleAttempt(session, id) {
    return {
      ...session,
      attempts: session.attempts.map((item) =>
        item.id === id ? { ...item, checked: !item.checked } : item
      ),
    };
  }

  function setMemo(session, memo) {
    return { ...session, memo };
  }

  function getProgress(session, items = ATTEMPTS) {
    const visible = getVisibleAttempts(session, items);
    const total = visible.length;
    const done = visible.filter((item) => item.checked).length;
    return {
      done,
      total,
      percent: total ? Math.round((done / total) * 100) : 0,
    };
  }

  function completeSession(session, options = {}) {
    const endedAt = options.endedAt || Date.now();
    const startedAt = options.startedAt || session.startedAt || endedAt;
    return {
      id: `${endedAt}-${Math.random().toString(36).slice(2, 8)}`,
      startedAt,
      endedAt,
      durationMinutes: Math.max(0, Math.round((endedAt - startedAt) / 60000)),
      memo: options.memo !== undefined ? options.memo : session.memo || "",
      checkedAttempts: getVisibleAttempts(session, options.items || ATTEMPTS)
        .filter((item) => item.checked)
        .map((item) => item.label),
    };
  }

  function createAppState(now = Date.now()) {
    const items = normalizeChecklistItems();
    return {
      items,
      session: createSession(now, items),
      history: [],
      storageOk: true,
      active: false,
      theme: "light",
    };
  }

  function startSession(state, now = Date.now()) {
    return {
      ...state,
      active: true,
      session: createSession(now, state.items),
    };
  }

  function completeActiveSession(state, options = {}) {
    const entry = completeSession(state.session, { ...options, items: state.items });
    return {
      ...state,
      active: false,
      session: createSession(options.nextStartedAt || Date.now(), state.items),
      history: [entry, ...(state.history || [])].slice(0, 100),
    };
  }

  function toggleThemeValue(theme) {
    return theme === "dark" ? "light" : "dark";
  }

  function safeRead() {
    try {
      const raw = global.localStorage && global.localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.history)) return null;
      return parsed;
    } catch (error) {
      return null;
    }
  }

  function safeWrite(state) {
    try {
      global.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (error) {
      return false;
    }
  }

  function formatClock(value) {
    return new Intl.DateTimeFormat("ko-KR", {
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    }).format(new Date(value));
  }

  function formatDuration(minutes) {
    if (minutes < 1) return "1분 미만";
    if (minutes < 60) return `${minutes}분`;
    const hours = Math.floor(minutes / 60);
    const rest = minutes % 60;
    return rest ? `${hours}시간 ${rest}분` : `${hours}시간`;
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function initApp() {
    const root = document.querySelector("#app");
    if (!root) return;

    let state = safeRead() || createAppState();
    let settingsSectionOpen = { default: true, custom: true };
    let expandedHints = new Set();

    state.items = normalizeChecklistItems(state.items);
    state.session = normalizeSession(state.session, state.items);
    if (typeof state.active !== "boolean") state.active = false;
    if (state.theme !== "dark") state.theme = "light";

    function getPersistedState() {
      return {
        session: state.session,
        history: state.history,
        active: state.active,
        theme: state.theme,
        items: state.items,
      };
    }

    function applyTheme() {
      document.documentElement.dataset.theme = state.theme;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", state.theme === "dark" ? "#202a2f" : "#f6f8f5");
    }

    function commit(next, options = {}) {
      state = next;
      state.storageOk = safeWrite(getPersistedState());
      render();
      if (options.reopenSettings) {
        setTimeout(() => root.querySelector("#settingsDialog")?.showModal(), 0);
      }
    }

    function renderThemeButton(className = "theme-toggle") {
      const label = state.theme === "dark" ? "일반 모드" : "다크 모드";
      return `<button class="${className}" data-theme-toggle>${label}</button>`;
    }

    function renderHeadActions() {
      return `
        <div class="head-actions">
          <button class="theme-toggle" data-history>이력</button>
          ${renderThemeButton()}
          <button class="theme-toggle" data-settings>설정</button>
        </div>
      `;
    }

    function renderAttempts() {
      const visible = getVisibleAttempts(state.session, state.items);
      return visible
        .map((item) => {
          const expanded = expandedHints.has(item.id);
          return `
            <div class="attempt ${item.checked ? "is-checked" : ""} ${expanded ? "is-expanded" : ""}">
              <button class="attempt-main" data-toggle="${item.id}">
                <span class="attempt-check" aria-hidden="true">${item.checked ? "✓" : ""}</span>
                <span class="attempt-copy">
                  <strong>${escapeHtml(item.label)}</strong>
                  ${expanded ? `<small>${escapeHtml(item.hint)}</small>` : ""}
                </span>
              </button>
              <button class="attempt-hint" data-hint="${item.id}" aria-expanded="${expanded}" aria-label="${expanded ? "설명 닫기" : "설명 보기"}">${expanded ? "✕" : "?"}</button>
            </div>
          `;
        })
        .join("");
    }

    function renderSettingRows(items) {
      return items
        .map(
          (item) => `
            <div class="setting-row" draggable="true" data-drag-item="${item.id}">
              <span class="drag-handle" data-drag-handle aria-hidden="true">↕</span>
              <div>
                <strong>${escapeHtml(item.label)}</strong>
                <small>${escapeHtml(item.hint)}</small>
              </div>
              <label class="switch">
                <input type="checkbox" data-visible-item="${item.id}" ${item.hidden ? "" : "checked"}>
                <span>${item.hidden ? "숨김" : "보임"}</span>
              </label>
            </div>
          `
        )
        .join("");
    }

    function renderSettingsSection(kind, title, items, emptyText) {
      const rows = renderSettingRows(items);
      return `
        <details class="settings-section" data-settings-section="${kind}"${settingsSectionOpen[kind] ? " open" : ""}>
          <summary>
            <span>${title}</span>
            <small>${items.length}개</small>
          </summary>
          <div class="settings-list" data-settings-list="${kind}">
            ${rows || `<p class="settings-empty">${emptyText}</p>`}
          </div>
        </details>
      `;
    }

    function renderSettingsDialog() {
      const items = normalizeChecklistItems(state.items);
      const defaultItems = items.filter((item) => !item.custom);
      const customItems = items.filter((item) => item.custom);
      const backupCode = btoa(
        unescape(
          encodeURIComponent(
            JSON.stringify({
              session: state.session,
              history: state.history,
              active: state.active,
              theme: state.theme,
              items: state.items,
            })
          )
        )
      );

      return `
        <dialog id="settingsDialog" class="settings-dialog">
          <form method="dialog">
            <div class="dialog-head">
              <strong>설정</strong>
              <button class="icon-btn" value="cancel" aria-label="닫기">×</button>
            </div>
            ${renderSettingsSection("default", "기본 항목", defaultItems, "기본 항목이 없어요.")}
            ${renderSettingsSection("custom", "사용자 항목", customItems, "아직 추가한 사용자 항목이 없어요.")}
            <div class="add-item-box">
              <strong>항목 추가</strong>
              <input id="newItemLabel" placeholder="예: 엄마랑 더 있고 싶니?">
              <textarea id="newItemHint" rows="3" placeholder="예: 잠깐 떨어진 뒤 울기 시작했는지 보고, 가까이 있어 주면 진정되는지 확인해요."></textarea>
              <button class="primary add-item-btn" id="addItemBtn" value="default">추가</button>
            </div>
            <details class="settings-section">
              <summary><span>백업 / 가져오기</span></summary>
              <div class="settings-list">
                <p class="settings-empty">아래 코드를 복사해 두면 다른 기기로 이력을 옆길 수 있어요. 가져올 코드를 붙여넣고 [가져오기]를 눌러요.</p>
                <textarea id="backupText" rows="4">${escapeHtml(backupCode)}</textarea>
                <button class="secondary add-item-btn" id="importBtn" value="default">가져오기</button>
              </div>
            </details>
          </form>
        </dialog>
      `;
    }

    function renderHistoryDialog() {
      return `
        <dialog id="historyDialog" class="settings-dialog">
          <form method="dialog">
            <div class="dialog-head">
              <strong>이력 ${state.history.length}건</strong>
              <button class="icon-btn" value="cancel" aria-label="닫기">×</button>
            </div>
            <div class="history-dialog-body">
              ${renderHistory()}
            </div>
          </form>
        </dialog>
      `;
    }

    function renderCompleteDialog() {
      return `
        <dialog id="completeDialog" class="settings-dialog complete-dialog">
          <form method="dialog">
            <div class="dialog-head">
              <strong>무엇이 통했나요?</strong>
              <button class="icon-btn" value="cancel" aria-label="닫기">×</button>
            </div>
            <p class="complete-copy">짧게 남겨 두면 다음 울음 때 바로 참고할 수 있어요.</p>
            <textarea id="completeMemo" rows="5" placeholder="${UI_COPY.memoPlaceholder}">${escapeHtml(
              state.session.memo || ""
            )}</textarea>
            <div class="complete-actions">
              <button class="secondary" data-complete-skip value="default">메모 없이 끝내기</button>
              <button class="primary" data-complete-save value="default">저장하고 끝내기</button>
            </div>
          </form>
        </dialog>
      `;
    }

    function renderHistory() {
      if (!state.history.length) {
        return `<div class="empty">아직 저장된 울음 이력이 없어요.</div>`;
      }

      return state.history
        .map(
          (entry) => `
            <article class="history-item">
              <div class="history-top">
                <div>
                  <strong>${formatClock(entry.endedAt)}</strong>
                  <span>${formatDuration(entry.durationMinutes)} 후 진정</span>
                </div>
                <button class="icon-btn" data-delete="${entry.id}" aria-label="이력 삭제">×</button>
              </div>
              <div class="history-tags">
                ${
                  entry.checkedAttempts.length
                    ? entry.checkedAttempts
                        .map((label) => `<span>${escapeHtml(label)}</span>`)
                        .join("")
                    : "<em>체크한 항목 없음</em>"
                }
              </div>
              ${
                entry.memo
                  ? `<p class="history-memo">${escapeHtml(entry.memo)}</p>`
                  : ""
              }
            </article>
          `
        )
        .join("");
    }

    function render() {
      applyTheme();
      const started = formatClock(state.session.startedAt);

      if (!state.active) {
        root.innerHTML = `
          <div class="shell home-shell">
            <header class="app-head">
              <div>
                <p class="eyebrow">${UI_COPY.eyebrow}</p>
                <h1>${UI_COPY.title}</h1>
              </div>
              ${renderHeadActions()}
            </header>

            ${
              state.storageOk === false
                ? `<div class="warn">이 브라우저에서 저장이 막혀 있어요. 홈 화면에 추가한 앱이나 일반 탭에서 다시 열어 보세요.</div>`
                : ""
            }

            <main class="start-panel">
              <div class="start-actions">
                <button class="start-btn" data-start>${UI_COPY.reset}</button>
              </div>
            </main>

            ${renderSettingsDialog()}
            ${renderHistoryDialog()}
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="shell">
          <header class="app-head">
            <div>
              <p class="eyebrow">${UI_COPY.eyebrow}</p>
              <h1>${UI_COPY.title}</h1>
              <span class="started">시작 ${started}</span>
            </div>
            ${renderHeadActions()}
          </header>

          ${
            state.storageOk === false
              ? `<div class="warn">이 브라우저에서 저장이 막혀 있어요. 홈 화면에 추가한 앱이나 일반 탭에서 다시 열어 보세요.</div>`
              : ""
          }

          <section class="care-note">
            <strong>바로 도움을 받아야 할 때</strong>
            <p>숨쉬기 힘들어 보이거나, 입술이 파랗거나, 고열/축 처짐/평소와 다른 울음이 있으면 체크리스트보다 의료진 연락이 먼저입니다.</p>
          </section>

          <main class="attempt-list">
            ${renderAttempts()}
          </main>

          <div class="complete-bar">
            <button class="primary" data-complete>${UI_COPY.complete}</button>
          </div>

          <div class="complete-spacer"></div>
        </div>

        ${renderSettingsDialog()}
        ${renderHistoryDialog()}
        ${renderCompleteDialog()}
      `;
    }

    function closeDialogFromBackdrop(event) {
      if (!["settingsDialog", "historyDialog", "completeDialog"].includes(event.target.id)) return false;
      event.target.close();
      return true;
    }

    root.addEventListener("click", (event) => {
      if (closeDialogFromBackdrop(event)) return;

      const toggle = event.target.closest("[data-toggle]");
      if (toggle) {
        commit({
          ...state,
          session: toggleAttempt(state.session, toggle.dataset.toggle),
        });
        return;
      }

      const hint = event.target.closest("[data-hint]");
      if (hint) {
        const id = hint.dataset.hint;
        if (expandedHints.has(id)) expandedHints.delete(id);
        else expandedHints.add(id);
        render();
        return;
      }

      if (event.target.closest("[data-reset]")) {
        commit({ ...state, session: createSession(Date.now(), state.items) });
        return;
      }

      if (event.target.closest("[data-start]")) {
        commit(startSession(state));
        return;
      }

      if (event.target.closest("[data-theme-toggle]")) {
        commit({ ...state, theme: toggleThemeValue(state.theme) });
        return;
      }

      if (event.target.closest("[data-settings]")) {
        root.querySelector("#settingsDialog").showModal();
        return;
      }

      if (event.target.closest("[data-history]")) {
        root.querySelector("#historyDialog").showModal();
        return;
      }

      const visibleToggle = event.target.closest("[data-visible-item]");
      if (visibleToggle) {
        const nextItems = setChecklistItemHidden(
          state.items,
          visibleToggle.dataset.visibleItem,
          !visibleToggle.checked
        );
        commit({
          ...state,
          items: nextItems,
          session: normalizeSession(state.session, nextItems),
        }, { reopenSettings: true });
        return;
      }

      if (event.target.id === "addItemBtn") {
        event.preventDefault();
        const labelInput = root.querySelector("#newItemLabel");
        const hintInput = root.querySelector("#newItemHint");
        const nextItems = addChecklistItem(state.items, {
          label: labelInput.value,
          hint: hintInput.value,
        });
        commit({
          ...state,
          items: nextItems,
          session: normalizeSession(state.session, nextItems),
        }, { reopenSettings: true });
        return;
      }

      if (event.target.closest("[data-complete]")) {
        const dialog = root.querySelector("#completeDialog");
        dialog.showModal();
        setTimeout(() => root.querySelector("#completeMemo")?.focus(), 0);
        return;
      }

      if (event.target.closest("[data-complete-save]")) {
        event.preventDefault();
        const memo = root.querySelector("#completeMemo")?.value.trim() || "";
        root.querySelector("#completeDialog")?.close();
        commit(completeActiveSession(state, { memo }));
        return;
      }

      if (event.target.closest("[data-complete-skip]")) {
        event.preventDefault();
        root.querySelector("#completeDialog")?.close();
        commit(completeActiveSession(state, { memo: "" }));
        return;
      }

      const del = event.target.closest("[data-delete]");
      if (del) {
        commit({
          ...state,
          history: state.history.filter((entry) => entry.id !== del.dataset.delete),
        });
        return;
      }
    });

    root.addEventListener("toggle", (event) => {
      const section = event.target.closest("[data-settings-section]");
      if (!section) return;
      settingsSectionOpen = {
        ...settingsSectionOpen,
        [section.dataset.settingsSection]: section.open,
      };
    }, true);

    let pointerDragId = "";
    let pointerDragPoint = null;
    let pointerDragHandle = null;
    let pointerDragPointerId = null;
    let settingsOrderDirty = false;

    const getSettingsRows = () => Array.from(root.querySelectorAll(".settings-list [data-drag-item]"));

    const getSettingsRowPositions = () =>
      new Map(
        getSettingsRows().map((row) => [row.dataset.dragItem, row.getBoundingClientRect()])
      );

    const sameItemOrder = (left, right) =>
      left.length === right.length && left.every((item, index) => item.id === right[index].id);

    const animateSettingsRows = (previousPositions) => {
      getSettingsRows().forEach((row) => {
        const previous = previousPositions.get(row.dataset.dragItem);
        if (!previous) return;
        const current = row.getBoundingClientRect();
        const dx = previous.left - current.left;
        const dy = previous.top - current.top;
        if (!dx && !dy) return;

        row.classList.add("is-shifting");
        row.style.transition = "none";
        row.style.setProperty("--drag-shift-x", `${dx}px`);
        row.style.setProperty("--drag-shift-y", `${dy}px`);
        row.getBoundingClientRect();
        row.style.transition = "";

        requestAnimationFrame(() => {
          row.style.setProperty("--drag-shift-x", "0px");
          row.style.setProperty("--drag-shift-y", "0px");
        });

        const cleanup = () => {
          row.classList.remove("is-shifting");
          row.style.removeProperty("--drag-shift-x");
          row.style.removeProperty("--drag-shift-y");
          row.removeEventListener("transitionend", cleanup);
        };
        row.addEventListener("transitionend", cleanup);
        setTimeout(cleanup, 260);
      });
    };

    function animateSettingsReorder(draggedId, targetId, placement) {
      if (!draggedId || !targetId || draggedId === targetId) return false;
      const nextItems = reorderChecklistItem(state.items, draggedId, targetId, placement);
      if (sameItemOrder(normalizeChecklistItems(state.items), nextItems)) return false;

      const rows = getSettingsRows();
      const draggedRow = rows.find((row) => row.dataset.dragItem === draggedId);
      const targetRow = rows.find((row) => row.dataset.dragItem === targetId);
      if (!draggedRow || !targetRow) return false;
      const list = targetRow.closest(".settings-list");
      if (!list || draggedRow.closest(".settings-list") !== list) return false;

      const previousPositions = getSettingsRowPositions();
      list.insertBefore(
        draggedRow,
        placement === "before" ? targetRow : targetRow.nextSibling
      );
      draggedRow.classList.add("dragging");
      animateSettingsRows(previousPositions);

      state = {
        ...state,
        items: nextItems,
        session: normalizeSession(state.session, nextItems),
      };
      state.storageOk = safeWrite(getPersistedState());
      settingsOrderDirty = true;
      return true;
    }

    function movePointerDragTo(point) {
      const target = document.elementFromPoint(point.x, point.y);
      const row = target ? target.closest("[data-drag-item]") : null;
      if (!row || row.dataset.dragItem === pointerDragId) return false;
      const rect = row.getBoundingClientRect();
      const placement = point.y < rect.top + rect.height / 2 ? "before" : "after";
      return animateSettingsReorder(pointerDragId, row.dataset.dragItem, placement);
    }

    const clearPointerDrag = () => {
      if (
        pointerDragHandle &&
        pointerDragHandle.releasePointerCapture &&
        pointerDragPointerId !== null
      ) {
        try {
          pointerDragHandle.releasePointerCapture(pointerDragPointerId);
        } catch (error) {
          // The pointer can already be released by the browser after a cancel.
        }
      }
      pointerDragId = "";
      pointerDragPoint = null;
      pointerDragHandle = null;
      pointerDragPointerId = null;
      root.querySelectorAll(".setting-row.dragging").forEach((row) => {
        row.classList.remove("dragging");
      });
    };

    root.addEventListener("pointerdown", (event) => {
      const handle = event.target.closest("[data-drag-handle]");
      if (!handle) return;
      const row = handle.closest("[data-drag-item]");
      pointerDragId = row ? row.dataset.dragItem : "";
      pointerDragPoint = { x: event.clientX, y: event.clientY };
      pointerDragHandle = handle;
      pointerDragPointerId = event.pointerId;
      if (handle.setPointerCapture) {
        try {
          handle.setPointerCapture(event.pointerId);
        } catch (error) {
          // Some browsers do not allow capture if the pointer is no longer active.
        }
      }
      if (row) row.classList.add("dragging");
      event.preventDefault();
    });

    root.addEventListener("pointermove", (event) => {
      if (!pointerDragId) return;
      pointerDragPoint = { x: event.clientX, y: event.clientY };
      movePointerDragTo(pointerDragPoint);
      event.preventDefault();
    });

    root.addEventListener("pointerup", (event) => {
      if (!pointerDragId) return;
      const point = pointerDragPoint || { x: event.clientX, y: event.clientY };
      movePointerDragTo(point);
      const shouldRefreshSettings = settingsOrderDirty;
      settingsOrderDirty = false;
      clearPointerDrag();
      if (shouldRefreshSettings) {
        setTimeout(() => {
          if (!pointerDragId) commit(state, { reopenSettings: true });
        }, 220);
      }
    });

    root.addEventListener("pointercancel", clearPointerDrag);

    root.addEventListener("dragstart", (event) => {
      const row = event.target.closest("[data-drag-item]");
      if (!row) return;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", row.dataset.dragItem);
      row.classList.add("dragging");
    });

    root.addEventListener("dragover", (event) => {
      if (!event.target.closest("[data-drag-item]")) return;
      event.preventDefault();
    });

    root.addEventListener("drop", (event) => {
      const row = event.target.closest("[data-drag-item]");
      if (!row) return;
      event.preventDefault();
      const draggedId = event.dataTransfer.getData("text/plain");
      const targetId = row.dataset.dragItem;
      const rect = row.getBoundingClientRect();
      const placement = event.clientY < rect.top + rect.height / 2 ? "before" : "after";
      const nextItems = reorderChecklistItem(state.items, draggedId, targetId, placement);
      commit({
        ...state,
        items: nextItems,
        session: normalizeSession(state.session, nextItems),
      }, { reopenSettings: true });
    });

    root.addEventListener("dragend", (event) => {
      const row = event.target.closest("[data-drag-item]");
      if (row) row.classList.remove("dragging");
    });

    root.addEventListener("close", (event) => {
      if (event.target.id === "settingsDialog") {
        render();
      }
    }, true);

    root.addEventListener("click", (event) => {
      if (event.target.id !== "importBtn") return;
      event.preventDefault();
      const text = root.querySelector("#backupText").value.trim();
      try {
        const imported = JSON.parse(decodeURIComponent(escape(atob(text))));
        if (!Array.isArray(imported.history) || !imported.session) {
          throw new Error("Invalid backup");
        }
        root.querySelector("#settingsDialog").close();
        commit({
          ...state,
          session: imported.session,
          history: imported.history,
          active: typeof imported.active === "boolean" ? imported.active : false,
          theme: imported.theme === "dark" ? "dark" : "light",
          items: normalizeChecklistItems(imported.items),
        });
      } catch (error) {
        alert("백업 코드가 올바르지 않아요.");
      }
    });

    render();
  }

  const api = {
    ATTEMPTS,
    UI_COPY,
    addChecklistItem,
    completeActiveSession,
    createAppState,
    createSession,
    getVisibleAttempts,
    normalizeChecklistItems,
    normalizeSession,
    reorderChecklistItem,
    setChecklistItemHidden,
    startSession,
    toggleThemeValue,
    toggleAttempt,
    setMemo,
    getProgress,
    completeSession,
    initApp,
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  }

  global.CryTracker = api;

  if (typeof document !== "undefined") {
    document.addEventListener("DOMContentLoaded", initApp);
  }
})(typeof window !== "undefined" ? window : globalThis);

    </script>
  </body>
</html>
