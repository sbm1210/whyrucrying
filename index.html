<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101418">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>왜 우냐</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101418;
        --panel: #181e24;
        --panel-2: #202831;
        --text: #f3f0e8;
        --muted: #9da8b2;
        --line: rgba(255, 255, 255, 0.1);
        --accent: #f0bf54;
        --accent-2: #6db5a3;
        --danger: #ef7c6b;
        font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        background:
          radial-gradient(circle at 20% 0%, rgba(240, 191, 84, 0.13), transparent 28rem),
          linear-gradient(180deg, #0c0f13 0%, var(--bg) 42%, #0f1515 100%);
        color: var(--text);
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .shell {
        width: min(100%, 520px);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      }

      .app-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0 18px;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(30px, 10vw, 48px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .started {
        display: inline-block;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .reset-btn,
      .secondary,
      .primary,
      .dialog-actions button {
        min-height: 42px;
        border-radius: 8px;
        padding: 0 14px;
        font-weight: 800;
      }

      .reset-btn,
      .secondary,
      .dialog-actions button {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }

      .warn,
      .care-note {
        border: 1px solid rgba(239, 124, 107, 0.34);
        border-radius: 8px;
        background: rgba(239, 124, 107, 0.1);
        padding: 12px;
        color: #ffd2ca;
        font-size: 13px;
        line-height: 1.5;
      }

      .progress-panel {
        margin: 2px 0 14px;
        padding: 14px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
      }

      .progress-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .progress-meta strong {
        font-size: 24px;
      }

      .progress-meta span {
        color: var(--muted);
        font-size: 13px;
      }

      .bar {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 180ms ease;
      }

      .attempt-list {
        display: grid;
        gap: 10px;
      }

      .attempt {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        width: 100%;
        min-height: 76px;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        text-align: left;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .attempt:active {
        transform: scale(0.99);
      }

      .attempt.is-checked {
        border-color: rgba(109, 181, 163, 0.65);
        background: linear-gradient(180deg, rgba(109, 181, 163, 0.14), var(--panel));
      }

      .attempt-check {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 2px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        color: #101418;
        background: transparent;
        font-weight: 900;
      }

      .attempt.is-checked .attempt-check {
        border-color: var(--accent-2);
        background: var(--accent-2);
      }

      .attempt-copy {
        display: grid;
        gap: 5px;
      }

      .attempt-copy strong {
        font-size: 16px;
        line-height: 1.25;
      }

      .attempt-copy small {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .memo-panel,
      .history {
        margin-top: 14px;
      }

      .memo-panel label,
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      textarea {
        width: 100%;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        padding: 12px;
        line-height: 1.5;
        outline: none;
      }

      textarea:focus {
        border-color: rgba(240, 191, 84, 0.62);
      }

      .primary-actions {
        display: grid;
        grid-template-columns: 0.75fr 1.25fr;
        gap: 10px;
        margin: 14px 0 0;
      }

      .primary {
        background: var(--accent);
        color: #18130a;
      }

      .care-note {
        margin-top: 10px;
      }

      .care-note strong {
        display: block;
        margin-bottom: 4px;
      }

      .history {
        padding-bottom: 20px;
      }

      .section-head h2 {
        color: var(--text);
        font-size: 18px;
      }

      .history-item {
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.045);
      }

      .history-item + .history-item {
        margin-top: 10px;
      }

      .history-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .history-top div {
        display: grid;
        gap: 3px;
      }

      .history-top span,
      .empty {
        color: var(--muted);
        font-size: 13px;
      }

      .icon-btn {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        font-size: 22px;
        line-height: 1;
      }

      .history-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      .history-tags span,
      .history-tags em {
        border-radius: 999px;
        background: rgba(109, 181, 163, 0.16);
        color: #bde8dd;
        padding: 5px 8px;
        font-size: 12px;
        font-style: normal;
      }

      .history-memo {
        margin-top: 10px;
        color: #ddd7cb;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .backup-dialog {
        width: min(calc(100% - 28px), 480px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #151b21;
        color: var(--text);
        padding: 0;
      }

      .backup-dialog::backdrop {
        background: rgba(0, 0, 0, 0.55);
      }

      .backup-dialog form {
        padding: 16px;
      }

      .dialog-head,
      .dialog-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .backup-dialog p {
        margin: 10px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .dialog-actions {
        margin-top: 10px;
        justify-content: flex-end;
      }

      @media (min-width: 760px) {
        .shell {
          padding-top: 34px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./app.js"></script>
  </body>
</html>
